# Dependency directions checked by `nimble checkVGraph`. See ADR-0001.

# Layers inside src/, lowest first. A module may import its own layer and any
# lower one, never a higher one. A name matches a file (common -> common.nim)
# or a directory (path -> path/*.nim). Modules under no listed layer are
# unconstrained: the umbrella module re-exports everything.
# Core layers:
# common < path < marker < flatten < prepared < stroke < mesh < raster < svg.
# The C ABI imports the
# facade, UniImage, and UniColor, so it sits above every core layer.
#   common/path/flatten import only UniLinalg (Vec2). raster imports UniImage
#   + UniColor (raster surface + paint color). svg imports path + UniColor.
#   c_api imports UniVector (facade) + UniImage + UniColor.
[layers]
common
path
marker
flatten
prepared
stroke
mesh
raster
svg
c_api

# Uni* engines this repo may name in `requires`. Any Uni* absent here is a
# back-edge in the family DAG. Non-Uni deps (nim, NimContracts) are external
# infra and go unchecked.
# UniVector sits above UniImage + UniColor + UniLinalg and is terminal.
[engines]
UniImage
UniColor
UniLinalg
